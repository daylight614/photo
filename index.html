<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>해솔네컷 부스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff7ef;--ink:#2b2236;--card:#ffffff;--accent:#ff7a00;--muted:#7a7088;--line:rgba(0,0,0,.12);--chip:#f3eee8;}
  body.theme-halloween{--bg:#1b1226;--ink:#f5eee6;--card:#2a1d3a;--accent:#ff7a00;--muted:#c2b4d6;--line:rgba(255,255,255,.15);--chip:#3a2a50;}
  body.theme-graduation{--bg:#eef2fb;--ink:#13234a;--card:#ffffff;--accent:#1f3c88;--muted:#5d6b8c;--line:rgba(0,0,0,.12);--chip:#e3eaf8;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  .screen{display:none;min-height:100vh;padding:24px 16px;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  .screen.active{display:flex}
  h1{font-family:'Jua',sans-serif;font-size:clamp(40px,7vw,72px);margin:0;font-weight:400}
  h2{font-family:'Jua',sans-serif;font-size:28px;margin:0;font-weight:400}
  h3{font-family:'Jua',sans-serif;font-size:20px;margin:0;font-weight:400}
  .lead{font-size:20px;color:var(--muted);margin:0;text-align:center}

  /* 1. 프레임 선택 */
  .frames{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .frame-card{position:relative;border:none;background:var(--card);border-radius:24px;padding:16px 16px 12px;box-shadow:0 8px 24px rgba(0,0,0,.1);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
  .frame-card:hover,.frame-card:focus-visible{transform:translateY(-4px)}
  .frame-card canvas{height:min(56vh,460px);width:auto;max-width:80vw;border-radius:4px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .frame-card .label{font-family:'Jua',sans-serif;font-size:26px;color:#2b2236}
  .frame-card .count{font-size:14px;color:#7a7088;min-height:1.2em}
  .badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#ff3d5a;color:#fff;font-family:'Jua',sans-serif;font-size:18px;padding:4px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.2);white-space:nowrap}

  /* 2. 촬영 */
  .shoot-layout{display:grid;grid-template-areas:"cam actions" "cam live";grid-template-columns:auto auto;gap:16px 28px;align-items:center;justify-content:center}
  .cam-wrap{grid-area:cam;position:relative;height:min(72vh,700px);aspect-ratio:9/10;border-radius:20px;overflow:hidden;background:#111}
  video{width:100%;height:100%;object-fit:cover;display:block}
  video.mirror{transform:scaleX(-1)}
  #countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:clamp(100px,18vw,180px);color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none}
  #mission{position:absolute;left:12px;right:12px;bottom:14px;display:none;text-align:center;background:rgba(0,0,0,.6);color:#fff;border-radius:16px;padding:10px 14px;pointer-events:none}
  #mission small{display:block;font-size:14px;opacity:.85}
  #mission b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(24px,4vw,36px);line-height:1.3}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
  #flash.on{opacity:1;transition:none}
  #shot-counter{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.55);color:#fff;padding:6px 14px;border-radius:999px;font-weight:700}
  #cam-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-size:18px;line-height:1.6}
  .live-wrap{grid-area:live;display:flex;justify-content:center}
  #live{height:min(40vh,380px);width:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:block}
  .actions{grid-area:actions;display:flex;flex-direction:column;gap:10px;align-items:center}
  .timer-note{margin:0;font-size:15px;color:var(--muted);text-align:center;line-height:1.5}
  .tool-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:'Jua',sans-serif;font-size:22px;padding:14px 28px;border-radius:14px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.small{font-size:16px;padding:8px 14px;border-radius:10px;border-width:1.5px}
  .btn.ghost{border-color:transparent;font-size:18px;text-decoration:underline;padding:8px 12px}
  .btn:disabled{opacity:.45;cursor:default}

  /* 3. 결과 */
  .result-layout{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .result-wrap{position:relative;line-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
  #result{height:min(84vh,820px);width:auto;max-width:92vw;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:block}
  #sticker-layer{position:absolute;inset:0;overflow:hidden;border-radius:4px}
  .stk{position:absolute;line-height:1;white-space:pre;cursor:move;touch-action:none;padding:.08em .12em;transform-origin:center}
  .stk.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .stk.text{font-family:'Jua','Noto Sans KR',sans-serif;paint-order:stroke fill}
  .stk.sel{outline:2px dashed #fff;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
  .stk .h{display:none;position:absolute;width:34px;height:34px;border-radius:50%;font:16px/34px 'Noto Sans KR',sans-serif;text-align:center;color:#fff;-webkit-text-stroke:0;box-shadow:0 2px 6px rgba(0,0,0,.35);touch-action:none}
  .stk.sel .h{display:block}
  .h-del{top:-17px;right:-17px;background:#e04848;cursor:pointer}
  .h-rs{bottom:-17px;right:-17px;background:#2f6bff;cursor:nwse-resize}
  .panel{background:var(--card);border-radius:20px;padding:20px;width:min(92vw,400px);display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-height:none}
  .tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px}
  .tab{flex:1;border:none;background:transparent;color:var(--ink);font-family:'Jua',sans-serif;font-size:18px;padding:10px;border-radius:9px;cursor:pointer}
  .tab.on{background:var(--accent);color:#fff}
  .pane{display:none;flex-direction:column;gap:14px}
  .pane.on{display:flex}
  .sec{display:flex;flex-direction:column;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:15px;cursor:pointer}
  .chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .emoji-grid button{border:none;background:var(--chip);border-radius:10px;font-size:28px;line-height:1;padding:8px 0;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .emoji-grid button:active{transform:scale(.9)}
  .text-row{display:flex;gap:6px}
  .text-row input{flex:1;min-width:0;font-size:17px;padding:10px 12px;border:2px solid #ccc;border-radius:10px;background:#fff;color:#222}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  .sw.on{border-color:var(--accent)}
  .hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
  .panel label{font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:6px}
  .panel input[type=email]{width:100%;font-size:18px;padding:12px;border:2px solid #ccc;border-radius:10px;background:#fff;color:#222}
  .panel label.check{flex-direction:row;font-weight:400;font-size:14px;color:var(--muted);align-items:flex-start;gap:8px;line-height:1.5}
  .check input{width:20px;height:20px;margin-top:2px;flex-shrink:0}
  .msg{min-height:1.2em;margin:0;font-weight:700;line-height:1.5;font-size:15px}
  .msg.ok{color:#22a35a} .msg.err{color:#e04848}
  #autoreset{margin:0;font-size:14px;color:var(--muted)}
  .row-btns{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,.9);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 핸드폰 */
  @media (max-width: 760px){
    .screen{padding:14px 12px;justify-content:flex-start}
    .shoot-layout{grid-template-areas:"actions" "cam" "live";grid-template-columns:1fr;width:100%;gap:12px}
    .cam-wrap{height:auto;width:100%;max-height:62vh;justify-self:center}
    #live{height:auto;width:46vw}
    .actions .btn.primary{width:100%}
    .actions{width:100%}
    #result{height:auto;width:92vw}
    .frame-card canvas{height:auto;width:min(70vw,320px)}
    .lead{font-size:17px}
  }
</style>
</head>
<body>

<!-- 1. 프레임 선택 -->
<section id="screen-select" class="screen active">
  <h1>해솔네컷 📸</h1>
  <p class="lead">마음에 드는 프레임을 골라 주세요</p>
  <div class="frames" id="frames"></div>
</section>

<!-- 2. 촬영 -->
<section id="screen-shoot" class="screen">
  <div class="shoot-layout">
    <div class="actions">
      <button id="btn-start" class="btn primary">📸 촬영 시작 (4컷)</button>
      <p class="timer-note" id="timer-note"></p>
      <div class="tool-row">
        <button id="btn-flip" class="btn small" hidden>🔄 카메라 전환</button>
        <button id="btn-sound" class="btn small">🔊 소리 켜짐</button>
        <button id="btn-back" class="btn small">↩ 프레임 다시 고르기</button>
      </div>
    </div>
    <div class="cam-wrap" id="cam-wrap">
      <video id="video" class="mirror" autoplay playsinline muted></video>
      <div id="countdown"></div>
      <div id="mission"><small id="mission-no"></small><b id="mission-text"></b></div>
      <div id="flash"></div>
      <div id="shot-counter">준비!</div>
      <div id="cam-error"></div>
    </div>
    <div class="live-wrap"><canvas id="live"></canvas></div>
  </div>
</section>

<!-- 3. 결과 -->
<section id="screen-result" class="screen">
  <div class="result-layout">
    <div class="result-wrap" id="result-wrap">
      <canvas id="result"></canvas>
      <div id="sticker-layer"></div>
    </div>
    <div class="panel">
      <div class="tabs">
        <button class="tab on" data-pane="pane-deco">1. 꾸미기</button>
        <button class="tab" data-pane="pane-send">2. 받기</button>
      </div>

      <div class="pane on" id="pane-deco">
        <div class="sec">
          <h3>🎨 사진 필터</h3>
          <div class="chips" id="filters"></div>
        </div>
        <div class="sec">
          <h3>😀 이모지 스티커</h3>
          <div class="emoji-grid" id="emojis"></div>
          <p class="hint">누르면 사진 가운데에 붙어요. 끌어서 옮기고, 파란 단추로 크기·방향을, 빨간 단추로 삭제해요.</p>
        </div>
        <div class="sec">
          <h3>✏️ 문구 스티커</h3>
          <div class="text-row">
            <input type="text" id="text-input" maxlength="20" placeholder="예) 우리 우정 영원히" autocomplete="off">
            <button class="btn small primary" id="btn-add-text">붙이기</button>
          </div>
          <div class="swatches" id="swatches"></div>
          <p class="msg" id="text-msg"></p>
        </div>
        <button class="btn primary" id="btn-to-send">다 꾸몄어요 → 받기</button>
      </div>

      <div class="pane" id="pane-send">
        <h2>완성! 🎉</h2>
        <label>이메일 주소<input type="email" id="email1" autocomplete="off" placeholder="example@email.com"></label>
        <label>이메일 주소 확인<input type="email" id="email2" autocomplete="off" placeholder="한 번 더 입력해 주세요"></label>
        <label class="check"><input type="checkbox" id="agree"> 사진은 어디에도 저장되지 않고, 입력한 이메일로만 발송된 뒤 삭제된다는 안내를 확인했어요.</label>
        <button id="btn-send" class="btn primary">메일로 받기</button>
        <button id="btn-download" class="btn">이 기기에 저장</button>
        <p class="msg" id="msg"></p>
        <p id="autoreset"></p>
      </div>

      <div class="row-btns">
        <button id="btn-retake" class="btn ghost">다시 찍기</button>
        <button id="btn-next" class="btn ghost">다음 사람 (처음으로)</button>
      </div>
    </div>
  </div>
</section>

<div id="toast"></div>

<script>
/* ===== 선생님이 바꿀 부분 ===== */
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycby-og_byENmVVaGQ1vuf1wx3ZXj0_Z6CAui6xmVfeGnjDz2yZY8eoAve62V-ryFVL62/exec',
  BOOTH_KEY: '3333',         // Code.gs의 BOOTH_KEY와 똑같이
  FRAMES: {
    // 프레임 이미지: 가로 1200 × 세로 1776 픽셀(10×14.8cm) PNG, 사진 4칸은 투명하게
    // label: 선택 화면 이름 / name: 메일 제목 / theme: 화면 색·미션·스티커 종류 (halloween 또는 graduation)
    'halloween-spooky': { src: 'frames/halloween-spooky.png', label: '🦇 으스스 할로윈', name: '할로윈 해솔네컷', theme: 'halloween',  fallbackBg: '#1b1226', fallbackText: '#ff8c1a' },
    'halloween-cute':   { src: 'frames/halloween-cute.png',   label: '🎃 귀여운 할로윈', name: '할로윈 해솔네컷', theme: 'halloween',  fallbackBg: '#1b1226', fallbackText: '#ff8c1a' },
    'graduation':       { src: 'frames/graduation.png',       label: '🌸 졸업',         name: '졸업 해솔네컷',   theme: 'graduation', fallbackBg: '#13234a', fallbackText: '#f2c14e' }
  },
  SLOTS: null,               // 투명 칸이 없는 프레임일 때만 사진 칸 위치를 직접 지정

  COUNTDOWN: 5,              // 컷마다 타이머(초)
  SHOW_MISSIONS: true,       // 랜덤 포즈 미션 표시
  SOUND: true,               // 효과음 기본값 (화면에서 끌 수 있어요)
  SHOW_POPULAR: true,        // 프레임 선택 화면에 인기 순위 표시
  SHOW_DOWNLOAD: true,       // '이 기기에 저장' 버튼 표시 여부
  AUTO_RESET_SEC: 20,        // 발송 성공 후 처음 화면으로 돌아가는 시간(초)

  // 랜덤 포즈 미션 (컷마다 하나씩 무작위로 나와요)
  MISSIONS: {
    common: ['브이 대신 손가락 하트!', '깜짝 놀란 표정!', '옆 친구 볼 콕 찌르기!', '윙크 한 번!', '볼 빵빵하게!', '세상 진지한 표정', '턱받침 귀요미 포즈', '다 같이 손 모아 큰 하트', '최고! 엄지 척', '서로 마주 보고 웃기'],
    halloween: ['좀비처럼 팔 쭉 뻗기!', '유령처럼 "우~" 하기', '흡혈귀 송곳니 포즈!', '무서운 척 비명 지르기!', '마녀처럼 사악한 웃음', '고양이 발 포즈 냥!', '사탕 뺏긴 표정'],
    graduation: ['졸업장 받은 척!', '학사모 던지는 포즈!', '10년 뒤 내 모습 상상하기', '선생님께 감사 인사 꾸벅!', '찐친 어깨동무!', '눈물 닦는 척 (감동)', '합격한 것처럼 환호!']
  },

  // 이모지 스티커
  EMOJIS: {
    halloween: ['🎃','👻','🦇','🕷️','🕸️','🧙','💀','🧛','🍬','🍭','🌙','🐈‍⬛'],
    graduation: ['🎓','🌸','💐','📜','🏫','🎊','🥳','💌','🌈','🍀','🎈','💙'],
    common: ['💖','✨','⭐','😎','😂','🥰','👍','✌️','🎉','🔥','💯','👑']
  },

  // 비속어 필터에 추가할 단어 (띄어쓰기·특수문자는 무시하고 검사해요)
  EXTRA_BAD_WORDS: []
};
/* ============================== */

const OUT_W = 1200, OUT_H = 1776;
const DEFAULT_SLOTS = (() => {
  const m = 60, g = 30, w = (OUT_W - m*2 - g) / 2, h = 700;
  return [{x:m,y:m,w,h},{x:m+w+g,y:m,w,h},{x:m,y:m+h+g,w,h},{x:m+w+g,y:m+h+g,w,h}];
})();
const FILTERS = [
  { id:'none',   name:'원본' },
  { id:'mono',   name:'흑백' },
  { id:'soft',   name:'뽀샤시' },
  { id:'film',   name:'필름' },
  { id:'purple', name:'보랏빛' },
  { id:'sky',    name:'하늘빛' }
];
const TEXT_COLORS = [
  { fill:'#ffffff', stroke:'#222222', name:'흰색' },
  { fill:'#111111', stroke:'#ffffff', name:'검정' },
  { fill:'#ff7a00', stroke:'#ffffff', name:'주황' },
  { fill:'#8b3dff', stroke:'#ffffff', name:'보라' },
  { fill:'#ff4f9a', stroke:'#ffffff', name:'분홍' },
  { fill:'#2fa8ff', stroke:'#ffffff', name:'하늘' }
];
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TEXT_FONT = "Jua, 'Noto Sans KR', sans-serif";

const $ = id => document.getElementById(id);
const frames = {};
let theme = null, stream = null, facing = 'user', shots = [], busy = false, resetTimer = null;
let currentFilter = 'none', filteredCache = {}, stickers = [], selectedId = null, nextStickerId = 1, textColor = 0;
let soundOn = CONFIG.SOUND, audioCtx = null, popular = {};
const wait = ms => new Promise(r => setTimeout(r, ms));
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); window.scrollTo(0,0); }
function themeOf(key){ return CONFIG.FRAMES[key].theme; }
function toast(text){ const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ================= 효과음 ================= */
function audio(){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, vol){
  if (!soundOn) return; const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  for (let i=0;i<len;i++){ const env = i < len*0.35 ? 1 : (i < len*0.45 ? 0.15 : 0.7); d[i] = (Math.random()*2-1) * env * Math.pow(1 - i/len, 2); }

/* ================= 프레임 ================= */
function loadImage(src){
  return new Promise(res => { const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null); img.src = src; });
}
function detectSlots(img){
  const S = 4, w = OUT_W / S, h = OUT_H / S;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { return null; }
  const mask = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++) mask[i] = data[i*4+3] < 128 ? 1 : 0;
  const seen = new Uint8Array(w*h), boxes = [];
  for (let start=0; start<w*h; start++){
    if (!mask[start] || seen[start]) continue;
    let minX=w, minY=h, maxX=0, maxY=0, area=0; const stack=[start]; seen[start]=1;
    while (stack.length){
      const p = stack.pop(), x = p % w, y = (p / w) | 0; area++;
      if (x<minX) minX=x; if (x>maxX) maxX=x; if (y<minY) minY=y; if (y>maxY) maxY=y;
      for (const q of [p-1,p+1,p-w,p+w]){
        if (q<0 || q>=w*h || seen[q] || !mask[q]) continue;
        if ((q===p-1 && x===0) || (q===p+1 && x===w-1)) continue;
        seen[q]=1; stack.push(q);
      }
    }
    if (area >= w*h*0.02) boxes.push({x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1, area});
  }
  if (boxes.length < 4) return null;
  boxes.sort((a,b) => b.area - a.area);
  const top4 = boxes.slice(0,4).sort((a,b) => (a.y+a.h/2) - (b.y+b.h/2));
  const rows = [top4.slice(0,2).sort((a,b)=>a.x-b.x), top4.slice(2).sort((a,b)=>a.x-b.x)];
  return rows.flat().map(b => ({ x:(b.x-1)*S, y:(b.y-1)*S, w:(b.w+2)*S, h:(b.h+2)*S }));
}
async function prepareFrame(key){
  const img = await loadImage(CONFIG.FRAMES[key].src);
  let slots = null, overlay = false;
  if (img) { slots = detectSlots(img); overlay = !!slots; }
  if (!slots) slots = CONFIG.SLOTS || DEFAULT_SLOTS;
  frames[key] = { img, slots, overlay };
}

/* ================= 사진 필터 ================= */
function applyFilter(src, id){
  if (id === 'none') return src;
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0);
  const im = ctx.getImageData(0, 0, c.width, c.height), d = im.data;
  const cl = v => v < 0 ? 0 : v > 255 ? 255 : v;
  for (let i=0;i<d.length;i+=4){
    let r = d[i], g = d[i+1], b = d[i+2];
    if (id === 'mono') {
      let y = 0.299*r + 0.587*g + 0.114*b; y = (y-128)*1.15 + 128; r = g = b = y;
    } else if (id === 'soft') {
      r = r + (255-r)*0.22 + 6; g = g + (255-g)*0.2; b = b + (255-b)*0.2 + 2;
      r = (r-128)*0.88+128; g = (g-128)*0.88+128; b = (b-128)*0.88+128;
    } else if (id === 'film') {
      r = r*1.06 + 10; g = g*0.98 + 6; b = b*0.84 + 4;
      r = r*0.88 + 18; g = g*0.88 + 16; b = b*0.88 + 14;
    } else if (id === 'purple') {
      r = r*0.92 + 18; g = g*0.78 + 4; b = b*1.05 + 30;
      r = (r-128)*1.08+128; g = (g-128)*1.08+128; b = (b-128)*1.08+128;
    } else if (id === 'sky') {
      r = r*0.9 + 8; g = g*0.98 + 12; b = b*1.05 + 26;
      r = r + (255-r)*0.08; g = g + (255-g)*0.08; b = b + (255-b)*0.08;
    }
    d[i] = cl(r); d[i+1] = cl(g); d[i+2] = cl(b);
  }
  ctx.putImageData(im, 0, 0);
  if (id === 'film') { // 가장자리 살짝 어둡게
    const gr = ctx.createRadialGradient(c.width/2, c.height/2, Math.min(c.width,c.height)*0.35, c.width/2, c.height/2, Math.max(c.width,c.height)*0.75);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(40,20,0,.35)');
    ctx.fillStyle = gr; ctx.fillRect(0,0,c.width,c.height);
  }
  return c;
}
function filteredShots(){
  if (!filteredCache[currentFilter]) filteredCache[currentFilter] = shots.map(s => applyFilter(s, currentFilter));
  return filteredCache[currentFilter];
}

/* ================= 합성 ================= */
function drawCover(ctx, src, x, y, w, h){
  const sw0 = src.width, sh0 = src.height, r = w / h;
  let sw = sw0, sh = sw0 / r; if (sh > sh0) { sh = sh0; sw = sh0 * r; }
  ctx.drawImage(src, (sw0-sw)/2, (sh0-sh)/2, sw, sh, x, y, w, h);
}
function drawStrip(canvas, key, photos, scale){
  const f = frames[key], cfg = CONFIG.FRAMES[key];
  canvas.width = Math.round(OUT_W*scale); canvas.height = Math.round(OUT_H*scale);
  const ctx = canvas.getContext('2d'); ctx.setTransform(scale,0,0,scale,0,0);
  ctx.imageSmoothingQuality = 'high';
  if (f.img && !f.overlay) ctx.drawImage(f.img, 0, 0, OUT_W, OUT_H);
  else { ctx.fillStyle = f.img ? '#ffffff' : cfg.fallbackBg; ctx.fillRect(0,0,OUT_W,OUT_H); }
  f.slots.forEach((s, i) => {
    if (photos[i]) drawCover(ctx, photos[i], s.x, s.y, s.w, s.h);
    else {
      ctx.fillStyle = 'rgba(128,128,128,.35)'; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.font = "120px Jua, sans-serif"; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i+1), s.x + s.w/2, s.y + s.h/2);
    }
  });
  if (f.img && f.overlay) ctx.drawImage(f.img, 0, 0, OUT_W, OUT_H);
  if (!f.img) {
    ctx.font = "72px Jua, sans-serif"; ctx.fillStyle = cfg.fallbackText; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const bottom = Math.max(...f.slots.map(s => s.y + s.h));
    ctx.fillText(cfg.name, OUT_W/2, (bottom + OUT_H)/2);
  }
}
function drawSticker(ctx, s){
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (s.type === 'emoji') {
    ctx.font = `${s.size}px ${EMOJI_FONT}`; ctx.fillText(s.content, 0, 0);
  } else {
    const col = TEXT_COLORS[s.color];
    ctx.font = `${s.size}px ${TEXT_FONT}`; ctx.lineJoin = 'round';
    ctx.lineWidth = s.size * 0.18; ctx.strokeStyle = col.stroke; ctx.strokeText(s.content, 0, 0);
    ctx.fillStyle = col.fill; ctx.fillText(s.content, 0, 0);
  }
  ctx.restore();
}
function composeFinal(){
  const c = document.createElement('canvas');
  drawStrip(c, theme, filteredShots(), 1);
  const ctx = c.getContext('2d'); ctx.setTransform(1,0,0,1,0,0);
  stickers.forEach(s => drawSticker(ctx, s));

}

}

/* ================= 발송 ================= */
function setMsg(m,cls){ const el = $('msg'); el.textContent = m; el.className = 'msg ' + (cls || ''); }
function resetForm(){
  $('email1').value = ''; $('email2').value = ''; $('agree').checked = false;
  $('btn-send').disabled = false; setMsg(''); $('autoreset').textContent = '';
  $('text-input').value = ''; $('text-msg').textContent = '';
  clearInterval(resetTimer); resetTimer = null;
}
function clearAll(){
  shots = []; filteredCache = {}; stickers = []; selectedId = null; currentFilter = 'none';
  $('sticker-layer').innerHTML = '';
  const r = $('result'); r.width = 0; r.height = 0;
  if (theme) renderLive();
  resetForm();
}
function goHome(){ clearAll(); setMission('', ''); theme = null; document.body.className = ''; show('screen-select'); loadPopular(); }
function startAutoReset(){
  let left = CONFIG.AUTO_RESET_SEC;
  $('autoreset').textContent = `${left}초 뒤 처음 화면으로 돌아가요.`;
  resetTimer = setInterval(() => {
    left--; $('autoreset').textContent = `${left}초 뒤 처음 화면으로 돌아가요.`;
    if (left <= 0) goHome();
  }, 1000);
}
async function sendMail(){
  const e1 = $('email1').value.trim(), e2 = $('email2').value.trim();
  if (!CONFIG.SCRIPT_URL) return setMsg('메일 발송이 아직 설정되지 않았어요. (선생님: SCRIPT_URL을 넣어 주세요)','err');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e1)) return setMsg('이메일 주소를 확인해 주세요.','err');
  if (e1 !== e2) return setMsg('두 이메일 주소가 서로 달라요.','err');
  if (!$('agree').checked) return setMsg('안내 확인란에 체크해 주세요.','err');
  if (!shots.length) return setMsg('사진이 없어요. 다시 찍어 주세요.','err');
  $('btn-send').disabled = true; setMsg('보내는 중이에요…');
  try {
    const image = composeFinal().split(',')[1];
    const res = await fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: CONFIG.BOOTH_KEY, email: e1, frame: theme, title: CONFIG.FRAMES[theme].name, image })
    });
    const out = await res.json();
    if (out.ok) { setMsg('메일을 보냈어요! 몇 분 안에 도착해요. (스팸함도 확인해 주세요)','ok'); chime(); startAutoReset(); }
    else { setMsg(out.error || '발송에 실패했어요.','err'); $('btn-send').disabled = false; }
  } catch (err) {
    setMsg('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.','err'); $('btn-send').disabled = false;
  }
}
function download(){
  if (!shots.length) return;
  const a = document.createElement('a'); a.href = composeFinal(); a.download = `해솔네컷_${Date.now()}.jpg`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ================= 화면 연결 ================= */
function buildFrameCards(){
  const wrap = $('frames'); wrap.innerHTML = '';
  for (const key of Object.keys(CONFIG.FRAMES)){
    const btn = document.createElement('button'); btn.className = 'frame-card'; btn.dataset.frame = key;
    const cv = document.createElement('canvas');
    const label = document.createElement('span'); label.className = 'label'; label.textContent = CONFIG.FRAMES[key].label;
    const count = document.createElement('span'); count.className = 'count';
    btn.append(cv, label, count); wrap.appendChild(btn);
    drawStrip(cv, key, [], 0.3);
    btn.addEventListener('click', () => selectFrame(key));
  }
}
async function selectFrame(key){
  audio();
  theme = key; document.body.className = 'theme-' + themeOf(key);
  const s = frames[theme].slots[0]; $('cam-wrap').style.aspectRatio = `${s.w} / ${s.h}`;
  shots = []; renderLive(); show('screen-shoot'); await startCamera();
}

$('timer-note').textContent = `⏱ 컷마다 ${CONFIG.COUNTDOWN}초 타이머가 있어요.` + (CONFIG.SHOW_MISSIONS ? ' 화면에 뜨는 미션 포즈를 따라 해 보세요!' : '');
$('btn-start').addEventListener('click', runShoot);
$('btn-back').addEventListener('click', () => { if (!busy) goHome(); });
$('btn-flip').addEventListener('click', flipCamera);
$('btn-sound').addEventListener('click', () => { soundOn = !soundOn; store('haesol_sound', soundOn ? '1' : '0'); updateSoundBtn(); if (soundOn) beep(880, 0.1); });
$('btn-send').addEventListener('click', sendMail);
$('btn-download').addEventListener('click', download);
$('btn-retake').addEventListener('click', () => { clearAll(); show('screen-shoot'); });
$('btn-next').addEventListener('click', goHome);
$('btn-add-text').addEventListener('click', addTextSticker);
$('text-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTextSticker(); } });
$('btn-to-send').addEventListener('click', () => switchPane('pane-send'));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchPane(t.dataset.pane)));
$('result-wrap').addEventListener('pointerdown', e => { if (!e.target.closest('.stk')) select(null); });
window.addEventListener('resize', layoutStickers);
if (!CONFIG.SHOW_DOWNLOAD) $('btn-download').style.display = 'none';
{ const saved = store('haesol_sound'); if (saved !== null) soundOn = saved === '1'; updateSoundBtn(); }

(async () => {
  try { await document.fonts.load('40px Jua'); } catch (e) {}
  await Promise.all(Object.keys(CONFIG.FRAMES).map(prepareFrame));
  buildFrameCards(); buildSwatches(); loadPopular();
})();
</script>
</body>
</html>
